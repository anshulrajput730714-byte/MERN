<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <h2>My Profile</h2>
    </header>

    <main class="card">

        <img
            class="avatar"
            src="https://placehold.co/120x120"
            alt="Profile Photo"
        >

        <h1>Anshul Kumar</h1>
        <p class="course">B.Tech CSE Student</p>

        <hr>

        <h3>About Me</h3>

        <div class="bio">
            My name is Anshul Kumar.

            I am a B.Tech CSE student.

            I am learning HTML, CSS and Java.

            My goal is to become a web developer.

            I enjoy building websites and learning
            new technologies.
        </div>

        <button class="contact">Contact Me</button>

    </main>

    <button class="float-btn">+</button>

</body>
</html>
