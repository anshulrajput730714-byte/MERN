<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <h2>MyWebsite</h2>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-text">
            <h1>Welcome to My Website</h1>
            <p>Learn new skills and build your future with us.</p>
            <button>Get Started</button>
        </div>

        <div class="hero-image">
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800" alt="Laptop">
        </div>
    </section>

    <!-- Services -->
    <section class="services">
        <h2>Our Services</h2>

        <div class="cards">
            <div class="card">
                <h3>Web Design</h3>
                <p>Create beautiful websites.</p>
            </div>

            <div class="card">
                <h3>Development</h3>
                <p>Build modern applications.</p>
            </div>

            <div class="card">
                <h3>Learning</h3>
                <p>Improve your skills every day.</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 MyWebsite. All Rights Reserved.</p>
    </footer>

</body>
</html>
